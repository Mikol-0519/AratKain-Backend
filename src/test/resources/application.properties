# Test-only configuration: shadows src/main/resources/application.properties on
# the test classpath so the Spring context loads without real Supabase
# credentials or a real JWT secret.
spring.datasource.url=jdbc:h2:mem:aratkain;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
jwt.secret=unit-test-only-jwt-secret-aratkain-0123456789abcdefghijklmn
jwt.expiration=86400000
cors.allowed-origins=http://localhost:3000
