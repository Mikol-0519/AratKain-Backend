# Server
server.port=${PORT:8080}

# Supabase PostgreSQL Database
# Credentials are provided by environment variables - never hardcode them here.
# Render injects these; locally set them before running (see SECURITY.md).
# SUPABASE_DB_URL example: jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# SSL required by Supabase
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT - JWT_SECRET must be set via environment variable (min 32 chars).
# Rotate the old value; it was committed to this repo.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://arat-kain.vercel.app
